name: ForgeAI Runner Diagnostic

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/runner-diagnostic.yml"

permissions: {}

jobs:
  runner-check:
    name: Verify GitHub-hosted runner startup
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Confirm runner started
        run: |
          echo "ForgeAI runner started successfully."
          echo "OS: $(. /etc/os-release && echo "$PRETTY_NAME")"
          echo "Architecture: $(uname -m)"
