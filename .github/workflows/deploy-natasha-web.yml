name: Deploy Natasha HTML app

on:
  push:
    branches: [forgeai-delivery]
    paths:
      - "web/**"
      - ".github/workflows/deploy-natasha-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: natasha-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out web app
        uses: actions/checkout@v4
      - name: Enable and configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload HTML app
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web
      - name: Deploy HTML app
        id: deployment
        uses: actions/deploy-pages@v4
