name: Android debug build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Check out NEXORA and llama.cpp
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android NDK and CMake
        run: |
          yes | sdkmanager --install "ndk;29.0.13113456" "cmake;3.31.6"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Publish debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nexora-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
