name: ForgeAI Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forgeai-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test, and package ForgeAI
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android SDK and native build tools
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "ndk;27.2.12479018"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Verify toolchain
        run: |
          java -version
          gradle --version
          sdkmanager --list_installed

      - name: Download built-in Natasha model
        run: |
          mkdir -p app/src/main/assets
          curl -L --fail --retry 3 --retry-delay 2 \
            -o app/src/main/assets/Llama-3.2-1B-Instruct-Q4_K_S.gguf \
            https://huggingface.co/bartowski/Llama-3.2-1B-Instruct-GGUF/resolve/main/Llama-3.2-1B-Instruct-Q4_K_S.gguf
          test -s app/src/main/assets/Llama-3.2-1B-Instruct-Q4_K_S.gguf
          sha256sum app/src/main/assets/Llama-3.2-1B-Instruct-Q4_K_S.gguf

      - name: Run unit tests and assemble APKs
        run: gradle testDebugUnitTest lintDebug assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: forgeai-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: forgeai-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
