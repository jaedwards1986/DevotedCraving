name: ForgeAI Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forgeai-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test, and package ForgeAI
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android SDK and native build tools
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "ndk;27.2.12479018"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Verify toolchain
        run: |
          java -version
          gradle --version
          sdkmanager --list_installed

      - name: Download the bundled default model
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/models
          MODEL_NAME="Qwen3-4B-Instruct-2507-Q4_K_M.gguf"
          MODEL_URL="https://huggingface.co/bartowski/Qwen_Qwen3-4B-Instruct-2507-GGUF/resolve/main/$MODEL_NAME?download=true"
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 --max-time 5400 "$MODEL_URL" -o "app/src/main/assets/models/$MODEL_NAME"
          MODEL_SIZE=$(stat -c%s "app/src/main/assets/models/$MODEL_NAME")
          echo "Bundled model size: $MODEL_SIZE bytes"
          test "$MODEL_SIZE" -ge 2350000000
          test "$MODEL_SIZE" -le 2650000000
          sha256sum "app/src/main/assets/models/$MODEL_NAME" | awk '{print $1}' > app/src/main/assets/models/model.sha256

      - name: Run unit tests and assemble APKs
        run: gradle testDebugUnitTest lintDebug assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Verify model is inside the installable APK
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$APK" | grep -F "assets/models/Qwen3-4B-Instruct-2507-Q4_K_M.gguf"
          APK_SIZE=$(stat -c%s "$APK")
          echo "Installable APK size: $APK_SIZE bytes"
          test "$APK_SIZE" -gt 1800000000

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: forgeai-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: forgeai-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
