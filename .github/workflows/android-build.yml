name: ForgeAI Android CI

on:
  schedule:
    - cron: "17 6 * * *"
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forgeai-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test, and package ForgeAI
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android SDK and native build tools
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "ndk;27.2.12479018"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Verify toolchain
        run: |
          java -version
          gradle --version
          sdkmanager --list_installed

      - name: Download the bundled default model
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/models
          MODEL_REPO="tensorblock/Llama-3-8B-Lexi-Uncensored-GGUF"
          MODEL_NAME="Llama-3-8B-Lexi-Uncensored-Q4_K_S.gguf"
          MODEL_SHA256="42733ea3d86323f51b4333304f4ca8327dcdcec6c3de7e3936cf96485554c351"
          python -m pip install --upgrade "huggingface_hub[hf_xet]"
          hf download "$MODEL_REPO" "$MODEL_NAME" --local-dir app/src/main/assets/models
          MODEL_PATH="app/src/main/assets/models/$MODEL_NAME"
          MODEL_SIZE=$(stat -c%s "$MODEL_PATH")
          echo "Bundled model: $MODEL_REPO/$MODEL_NAME ($MODEL_SIZE bytes)"
          test "$MODEL_SIZE" -ge 4200000000
          test "$MODEL_SIZE" -le 4600000000
          echo "$MODEL_SHA256  $MODEL_PATH" | sha256sum --check
          printf '%s  %s\n' "$MODEL_SHA256" "$MODEL_NAME" > app/src/main/assets/models/model.sha256

      - name: Run unit tests and assemble APKs
        run: gradle compileDebugAndroidTestKotlin testDebugUnitTest lintDebug assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Verify pinned Llama 3 GGUF is inside the installable APK
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$APK" | grep -F "assets/models/Llama-3-8B-Lexi-Uncensored-Q4_K_S.gguf"
          APK_SIZE=$(stat -c%s "$APK")
          echo "Installable APK size: $APK_SIZE bytes"
          test "$APK_SIZE" -gt 4000000000

      - name: Stage APKs and write archive outside checkout
        run: |
          set -euo pipefail
          STAGE_DIR="$RUNNER_TEMP/forgeai-apk-stage"
          ARCHIVE="$RUNNER_TEMP/forgeai-apks.zip"
          mkdir -p "$STAGE_DIR"
          cp app/build/outputs/apk/debug/*.apk "$STAGE_DIR/"
          cp app/build/outputs/apk/release/*.apk "$STAGE_DIR/"
          (cd "$STAGE_DIR" && zip -q "$ARCHIVE" ./*.apk)
          test -s "$ARCHIVE"
          unzip -l "$ARCHIVE"

      - name: Publish APK archive
        uses: actions/upload-artifact@v4
        with:
          name: forgeai-apks
          path: ${{ runner.temp }}/forgeai-apks.zip
          if-no-files-found: error
          retention-days: 14
