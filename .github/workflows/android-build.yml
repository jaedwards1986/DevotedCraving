name: ForgeAI Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forgeai-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test, and package ForgeAI
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android SDK and native build tools
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "ndk;27.2.12479018"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Verify toolchain
        run: |
          java -version
          gradle --version
          sdkmanager --list_installed

      - name: Download the bundled default model
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/models
          MODEL_NAME="Qwen_Qwen3-4B-Instruct-2507-Q4_K_M.gguf"
          python -m pip install --upgrade "huggingface_hub[hf_xet]"
          hf download bartowski/Qwen_Qwen3-4B-Instruct-2507-GGUF "$MODEL_NAME" --local-dir app/src/main/assets/models
          MODEL_SIZE=$(stat -c%s "app/src/main/assets/models/$MODEL_NAME")
          echo "Bundled model size: $MODEL_SIZE bytes"
          test "$MODEL_SIZE" -ge 2300000000
          test "$MODEL_SIZE" -le 2800000000
          echo "2fde00ce69dd4899c70d020845e2638353015bba0fdf161b3eb965f2bca4464e  app/src/main/assets/models/$MODEL_NAME" | sha256sum --check
          echo "2fde00ce69dd4899c70d020845e2638353015bba0fdf161b3eb965f2bca4464e" > app/src/main/assets/models/model.sha256

      - name: Run unit tests and assemble APKs
        run: gradle testDebugUnitTest lintDebug assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Run Android instrumentation tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: gradle connectedDebugAndroidTest --no-daemon --stacktrace

      - name: Verify model is inside the installable APK
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$APK" | grep -F "assets/models/Qwen_Qwen3-4B-Instruct-2507-Q4_K_M.gguf"
          APK_SIZE=$(stat -c%s "$APK")
          echo "Installable APK size: $APK_SIZE bytes"
          test "$APK_SIZE" -gt 1800000000

      - name: Stage APKs and write archive outside checkout
        run: |
          set -euo pipefail
          STAGE_DIR="$RUNNER_TEMP/forgeai-apk-stage"
          ARCHIVE="$RUNNER_TEMP/forgeai-apks.zip"
          mkdir -p "$STAGE_DIR"
          cp app/build/outputs/apk/debug/*.apk "$STAGE_DIR/"
          cp app/build/outputs/apk/release/*.apk "$STAGE_DIR/"
          (cd "$STAGE_DIR" && zip -q "$ARCHIVE" ./*.apk)
          test -s "$ARCHIVE"
          unzip -l "$ARCHIVE"

      - name: Publish APK archive
        uses: actions/upload-artifact@v4
        with:
          name: forgeai-apks
          path: ${{ runner.temp }}/forgeai-apks.zip
          if-no-files-found: error
          retention-days: 14
